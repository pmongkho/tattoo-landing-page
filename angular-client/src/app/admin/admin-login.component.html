<div class="p-6 max-w-md mx-auto"><h1 class="text-2xl mb-4">Admin Login</h1>
<form [formGroup]="form" (ngSubmit)="login()" class="grid gap-3">
<input class="bg-zinc-900 p-2" type="email" autocomplete="username" formControlName="email" placeholder="Email" />
<input class="bg-zinc-900 p-2" type="password" autocomplete="current-password" formControlName="password" placeholder="Password" />
<button class="bg-white text-black p-2" [disabled]="form.invalid || submitting">{{ submitting ? 'Signing in…' : 'Login' }}</button>
<p class="text-red-400" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p></form></div>
